<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skillpath — Learn the skill. Skip the fluff.</title>
    <script>
      // Sets the theme attribute before anything paints, so there's no
      // flash of the wrong theme on load. Kept as a tiny inline script
      // (not part of the React bundle) specifically so it runs before the
      // first paint — a useEffect in React always runs after that.
      (function () {
        try {
          var stored = localStorage.getItem("skillpath-theme")
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = "light"
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
